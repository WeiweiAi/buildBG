[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["bg"]


[project]
name = "buildbg"
version = "0.1.0"
description = "Build a bond graph"
readme = "README.md"
authors = [
    { name = "Weiwei Ai", email = "wai484@aucklanduni.ac.nz" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "graphviz>=0.21",
    "networkx>=3.6.1",
    "numpy>=2.5.3",
    "python-libsbml>=5.21.1",
    "sympy>=1.14.0",
]

[project.scripts]
buildbg = "bg.__main__:main"
